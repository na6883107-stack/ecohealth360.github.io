<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b35">
  <meta name="description" content="Open or share the ECO-HEALTH 360° website using its link or QR code.">
  <title>Open ECO-HEALTH 360°</title>
  <style>
    :root{font-family:Arial,Tahoma,sans-serif;color:#17332f;background:#f3f7f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #dce7df;border-radius:26px;padding:32px;text-align:center;box-shadow:0 18px 45px #133d3117}.logo{font-size:38px}.title{margin:8px 0;color:#176b55}.qr{display:block;width:min(300px,80vw);height:auto;margin:22px auto;border:10px solid white;box-shadow:0 5px 25px #17332f18}.link{display:block;overflow-wrap:anywhere;color:#176b55;margin:14px 0 20px}.button{display:inline-block;background:#176b55;color:#fff;text-decoration:none;padding:12px 20px;border-radius:12px;font-weight:bold}.hint{font-size:13px;color:#60736e;line-height:1.7;margin-top:22px}.download{display:block;color:#176b55;font-size:13px;margin-top:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">🌿</div>
    <h1 class="title">ECO-HEALTH 360°</h1>
    <p>Scan this QR code to open the website, or use the direct link below.</p>
    <img id="qrImage" class="qr" alt="QR code linking to the ECO-HEALTH 360° website">
    <a id="siteLink" class="link"></a>
    <a id="openButton" class="button">Open website</a>
    <a id="downloadLink" class="download" download="eco-health-360-qr.png">Download QR code</a>
    <p class="hint">If the website link is not live yet, enable GitHub Pages in the repository settings: Settings → Pages → Deploy from a branch → main → /(root).</p>
  </main>
  <script>
    // GitHub Pages project-site URL for this repository.
    const siteUrl = 'https://na6883107-stack.github.io/ecohealth360.github.io/';
    const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&format=png&data=' + encodeURIComponent(siteUrl);
    document.getElementById('qrImage').src = qrUrl;
    document.getElementById('siteLink').href = siteUrl;
    document.getElementById('siteLink').textContent = siteUrl;
    document.getElementById('openButton').href = siteUrl;
    document.getElementById('downloadLink').href = qrUrl;
  </script>
</body>
</html>
